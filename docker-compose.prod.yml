name: ${COMPOSE_PROJECT_NAME:-wingman-tower}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-wingman-tower-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-coworker_v4}
      POSTGRES_USER: ${DB_USER:?set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - tower-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?set DB_USER} -d ${DB_NAME:-coworker_v4}"]
      interval: 5s
      timeout: 5s
      retries: 20

  graph-postgres:
    image: apache/age:release_PG16_1.6.0
    container_name: ${GRAPH_POSTGRES_CONTAINER_NAME:-wingman-tower-graph-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GRAPH_DB_NAME:-tower_graph}
      POSTGRES_USER: ${GRAPH_DB_ADMIN_USER:?set GRAPH_DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${GRAPH_DB_ADMIN_PASSWORD:?set GRAPH_DB_ADMIN_PASSWORD}
    volumes:
      - tower-graph-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GRAPH_DB_ADMIN_USER:?set GRAPH_DB_ADMIN_USER} -d ${GRAPH_DB_NAME:-tower_graph}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    profiles: ["minio"]
    # Pinned to the verified cached MinIO CE digest (upstream removed unpinned Docker Hub tags).
    image: ${MINIO_IMAGE:-minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    pull_policy: never
    container_name: ${MINIO_CONTAINER_NAME:-wingman-tower-minio}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY:?set STORAGE_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_KEY:?set STORAGE_S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_HOST_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_HOST_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - tower-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    profiles: ["minio"]
    # Uses the built Tower Bun/AWS S3 initializer instead of the removed MinIO mc image.
    image: ${TOWER_IMAGE:-wingman-tower-tower:latest}
    pull_policy: never
    container_name: ${MINIO_INIT_CONTAINER_NAME:-wingman-tower-minio-init}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["bun", "run", "src/scripts/storage-init.ts"]
    environment:
      STORAGE_PROVIDER: minio
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:?set STORAGE_S3_ACCESS_KEY}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:?set STORAGE_S3_SECRET_KEY}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-superbased-storage}
      STORAGE_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-true}
      STORAGE_INIT_WRITE_SENTINEL: "false"
      STORAGE_INIT_ENFORCE_PRIVATE_POLICY: "true"

  seaweedfs:
    profiles: ["seaweedfs"]
    # NStack build of SeaweedFS 4.55 (deploy/seaweedfs; scripts/nstack-seaweedfs-image.ts). Installations
    # set SEAWEEDFS_IMAGE to its image ID; there is no fallback to the stock upstream image.
    image: ${SEAWEEDFS_IMAGE:-nstack-seaweedfs:4.55-nstack.1}
    pull_policy: never
    container_name: ${SEAWEEDFS_CONTAINER_NAME:-wingman-tower-seaweedfs}
    user: "1000:1000"
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/nstack/render-seaweedfs-config.sh"]
    env_file:
      - path: ${SEAWEEDFS_ADMIN_ENV_FILE:-.env.seaweedfs-admin}
        required: false
    environment:
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-superbased-storage}
      STORAGE_S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-${STORAGE_S3_ACCESS_KEY:?set STORAGE_S3_ACCESS_KEY}}
      STORAGE_S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-${STORAGE_S3_SECRET_KEY:?set STORAGE_S3_SECRET_KEY}}
      SEAWEEDFS_ACTIVE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      SEAWEEDFS_EXPLICIT_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-}
      SEAWEEDFS_EXPLICIT_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-}
      SEAWEEDFS_ADMIN_ACCESS_KEY_OVERRIDE: ${SEAWEEDFS_ADMIN_ACCESS_KEY:-}
      SEAWEEDFS_ADMIN_SECRET_KEY_OVERRIDE: ${SEAWEEDFS_ADMIN_SECRET_KEY:-}
      SEAWEEDFS_JWT_SECRET_OVERRIDE: ${SEAWEEDFS_JWT_SECRET:-}
      SEAWEEDFS_JWT_READ_SECRET_OVERRIDE: ${SEAWEEDFS_JWT_READ_SECRET:-}
      SEAWEEDFS_JWT_FILER_SECRET_OVERRIDE: ${SEAWEEDFS_JWT_FILER_SECRET:-}
      SEAWEEDFS_JWT_FILER_READ_SECRET_OVERRIDE: ${SEAWEEDFS_JWT_FILER_READ_SECRET:-}
      SEAWEEDFS_JWT_FILER_SUBSCRIBE_SECRET_OVERRIDE: ${SEAWEEDFS_JWT_FILER_SUBSCRIBE_SECRET:-}
      SEAWEEDFS_ALLOWED_ORIGINS: ${SEAWEEDFS_ALLOWED_ORIGINS:-*}
      SEAWEEDFS_EXTERNAL_URL: ${SEAWEEDFS_EXTERNAL_URL:-${STORAGE_S3_ENDPOINT_PUBLIC:-}}
      SEAWEEDFS_MIN_FREE_SPACE: ${SEAWEEDFS_MIN_FREE_SPACE:-10}
      SEAWEEDFS_VOLUME_SIZE_LIMIT_MB: ${SEAWEEDFS_VOLUME_SIZE_LIMIT_MB:-1024}
    ports:
      - "${SEAWEEDFS_HOST_BIND_ADDRESS:-127.0.0.1}:${SEAWEEDFS_API_HOST_PORT:-8333}:8333"
    volumes:
      - tower-seaweedfs-data:/data
      - ./deploy/nstack/render-seaweedfs-config.sh:/opt/nstack/render-seaweedfs-config.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 512
    mem_limit: ${SEAWEEDFS_MEM_LIMIT:-2g}
    cpus: ${SEAWEEDFS_CPUS:-2.0}
    networks:
      storage-internal:
      storage-host:
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8333/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30

  seaweedfs-init:
    profiles: ["seaweedfs"]
    image: ${TOWER_IMAGE:-wingman-tower-tower:latest}
    pull_policy: never
    container_name: ${SEAWEEDFS_INIT_CONTAINER_NAME:-wingman-tower-seaweedfs-init}
    restart: "no"
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["bun", "run", "src/scripts/storage-init.ts"]
    env_file:
      - path: ${SEAWEEDFS_ADMIN_ENV_FILE:-.env.seaweedfs-admin}
        required: false
    environment:
      STORAGE_PROVIDER: seaweedfs
      STORAGE_S3_ENDPOINT: http://seaweedfs:8333
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_INIT_ACCESS_KEY_OVERRIDE: ${SEAWEEDFS_ADMIN_ACCESS_KEY:-}
      STORAGE_INIT_SECRET_KEY_OVERRIDE: ${SEAWEEDFS_ADMIN_SECRET_KEY:-}
      STORAGE_S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-${STORAGE_S3_ACCESS_KEY:?set STORAGE_S3_ACCESS_KEY}}
      STORAGE_S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-${STORAGE_S3_SECRET_KEY:?set STORAGE_S3_SECRET_KEY}}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-superbased-storage}
      STORAGE_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-true}
      STORAGE_INIT_WRITE_SENTINEL: "true"
      STORAGE_INIT_PROBE_RW: "true"
    networks:
      storage-internal:

  nostr-relay:
    image: docker.io/scsibug/nostr-rs-relay:0.10.0@sha256:48d54c2d2781577cf3ed2951112f0953dc2c5e7c9d2ea20c64e8c0fa37d16e4d
    container_name: ${NOSTR_RELAY_CONTAINER_NAME:-wingman-tower-nostr-relay}
    restart: unless-stopped
    environment:
      NOSTR_RELAY_PUBLIC_ORIGIN: ${NOSTR_RELAY_PUBLIC_ORIGIN:?set NOSTR_RELAY_PUBLIC_ORIGIN}
      NOSTR_RELAY_PUBLISH_PUBKEYS: ${NOSTR_RELAY_PUBLISH_PUBKEYS:?set NOSTR_RELAY_PUBLISH_PUBKEYS}
    entrypoint: ["/bin/bash", "/opt/nstack/render-relay-config.sh"]
    ports:
      - "${NOSTR_RELAY_HOST_BIND_ADDRESS:-127.0.0.1}:${NOSTR_RELAY_HOST_PORT:-7777}:8080"
    volumes:
      - tower-nostr-relay-data:/usr/src/app/db
      - ./deploy/nstack/render-relay-config.sh:/opt/nstack/render-relay-config.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET / HTTP/1.1\\r\\nHost: localhost\\r\\nAccept: application/nostr+json\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  blossom:
    image: ghcr.io/hzrd149/blossom-server:6.4.1@sha256:446fa6c4b0ca529a1fbceabf5ea75839b5b76dfb0d0e1d150f3bae5f9a52b3b8
    container_name: ${BLOSSOM_CONTAINER_NAME:-wingman-tower-blossom}
    restart: unless-stopped
    environment:
      BLOSSOM_REQUIRE_CONFIG: "1"
      BLOSSOM_PUBLIC_DOMAIN: ${BLOSSOM_PUBLIC_DOMAIN:?set BLOSSOM_PUBLIC_DOMAIN}
      BLOSSOM_PUBLISH_PUBKEY: ${BLOSSOM_PUBLISH_PUBKEY:?set BLOSSOM_PUBLISH_PUBKEY}
    ports:
      - "${BLOSSOM_HOST_BIND_ADDRESS:-127.0.0.1}:${BLOSSOM_HOST_PORT:-3002}:3000"
    volumes:
      - tower-blossom-data:/app/data
      - ./deploy/nstack/blossom.yml:/app/config.yml:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      # Deno may materialize architecture-specific native npm bindings here on
      # first boot; 256 MiB is insufficient for the pinned image's dependencies.
      # Bound the ephemeral cache to 1 GiB within the 2 GiB container limit,
      # leaving room for /tmp and the server. Native modules require exec on
      # this mount; keep the image filesystem read-only.
      - /deno-dir:size=1g,mode=1777,exec
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "deno", "eval", "const r=await fetch('http://127.0.0.1:3000/');Deno.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  tower:
    build:
      context: .
      args:
        BUN_IMAGE: ${TOWER_BUN_IMAGE:-oven/bun:1.4.4}
        TOWER_BUILD_TIME: ${TOWER_BUILD_TIME:-}
        TOWER_GIT_COMMIT: ${TOWER_GIT_COMMIT:-}
        TOWER_GIT_BRANCH: ${TOWER_GIT_BRANCH:-}
    image: ${TOWER_IMAGE:-wingman-tower-tower:latest}
    container_name: ${TOWER_CONTAINER_NAME:-wingman-tower-b3}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      graph-postgres:
        condition: service_healthy
    env_file:
      - ${TOWER_ENV_FILE:-.env.prod}
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-coworker_v4}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      GRAPH_ENABLED: ${GRAPH_ENABLED:-false}
      GRAPH_DB_HOST: ${GRAPH_DB_HOST:-graph-postgres}
      GRAPH_DB_PORT: ${GRAPH_DB_PORT:-5432}
      GRAPH_DB_NAME: ${GRAPH_DB_NAME:-tower_graph}
      GRAPH_DB_ADMIN_USER: ${GRAPH_DB_ADMIN_USER:?set GRAPH_DB_ADMIN_USER}
      GRAPH_DB_ADMIN_PASSWORD: ${GRAPH_DB_ADMIN_PASSWORD:?set GRAPH_DB_ADMIN_PASSWORD}
      GRAPH_DB_APP_USER: ${GRAPH_DB_APP_USER:?set GRAPH_DB_APP_USER}
      GRAPH_DB_APP_PASSWORD: ${GRAPH_DB_APP_PASSWORD:?set GRAPH_DB_APP_PASSWORD}
      GRAPH_DB_MAX_CONNECTIONS: ${GRAPH_DB_MAX_CONNECTIONS:-10}
      GRAPH_AGE_GRAPH_NAME: ${GRAPH_AGE_GRAPH_NAME:-tower_memory}
      GRAPH_ALLOWED_NPUBS: ${GRAPH_ALLOWED_NPUBS:-}
      PORT: ${TOWER_PORT:-3100}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-}
      STORAGE_S3_DEFAULT_MINIO_ENDPOINT: http://minio:9000
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_ENDPOINT_PUBLIC: ${STORAGE_S3_ENDPOINT_PUBLIC:-http://127.0.0.1:9000}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:?set STORAGE_S3_ACCESS_KEY}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:?set STORAGE_S3_SECRET_KEY}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-superbased-storage}
      STORAGE_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-true}
      STORAGE_PRESIGN_UPLOAD_TTL_SECONDS: ${STORAGE_PRESIGN_UPLOAD_TTL_SECONDS:-900}
      STORAGE_PRESIGN_DOWNLOAD_TTL_SECONDS: ${STORAGE_PRESIGN_DOWNLOAD_TTL_SECONDS:-900}
      STORAGE_REQUIRE_SENTINEL: ${STORAGE_REQUIRE_SENTINEL:-}
      NSTACK_MIGRATION_START_RUN_ID: ${NSTACK_MIGRATION_START_RUN_ID:-}
      # Explicitly scrub SeaweedFS init/admin and internal gRPC JWT keys from Tower runtime env
      # so Tower never holds Admin/S3Tables or gRPC signing credentials even if present in env_file.
      SEAWEEDFS_ADMIN_ACCESS_KEY: ""
      SEAWEEDFS_ADMIN_SECRET_KEY: ""
      SEAWEEDFS_ACCESS_KEY: ""
      SEAWEEDFS_SECRET_KEY: ""
      SEAWEEDFS_JWT_SECRET: ""
      SEAWEEDFS_JWT_READ_SECRET: ""
      SEAWEEDFS_JWT_FILER_SECRET: ""
      SEAWEEDFS_JWT_FILER_READ_SECRET: ""
      SEAWEEDFS_JWT_FILER_SUBSCRIBE_SECRET: ""
      SUPERBASED_DIRECT_HTTPS_URL: ${SUPERBASED_DIRECT_HTTPS_URL:?set SUPERBASED_DIRECT_HTTPS_URL}
      ADMIN_NPUB: ${ADMIN_NPUB:?set ADMIN_NPUB}
      FLIGHT_DECK_PG_APP_NPUB: ${FLIGHT_DECK_PG_APP_NPUB:?set FLIGHT_DECK_PG_APP_NPUB}
      SUPERBASED_SERVICE_NSEC: ${SUPERBASED_SERVICE_NSEC:?set SUPERBASED_SERVICE_NSEC}
      SUPERBASED_SERVICE_PUBKEY_HEX: ${SUPERBASED_SERVICE_PUBKEY_HEX:-}
      SUPERBASED_SERVICE_NPUB: ${SUPERBASED_SERVICE_NPUB:-}
      NSTACK_AUTOPILOT_PUBLIC_ORIGIN: ${NSTACK_AUTOPILOT_PUBLIC_ORIGIN:-}
      NSTACK_GRASP_ENABLED: ${NSTACK_GRASP_ENABLED:-false}
      NSTACK_GRASP_PUBLIC_ORIGIN: ${NSTACK_GRASP_PUBLIC_ORIGIN:-}
      NSTACK_GRASP_HEALTH_URL: ${NSTACK_GRASP_HEALTH_URL:-}
      NSTACK_GRASP_VERSION: ${NSTACK_GRASP_VERSION:-3.0.1-b990d218}
      NSTACK_RELAY_ENABLED: ${NSTACK_RELAY_ENABLED:-true}
      NSTACK_RELAY_PUBLIC_ORIGIN: ${NOSTR_RELAY_PUBLIC_ORIGIN:?set NOSTR_RELAY_PUBLIC_ORIGIN}
      NSTACK_RELAY_HEALTH_URL: http://nostr-relay:8080/
      NSTACK_RELAY_VERSION: "0.10.0"
      NSTACK_BLOSSOM_ENABLED: ${NSTACK_BLOSSOM_ENABLED:-true}
      NSTACK_BLOSSOM_PUBLIC_ORIGIN: ${NSTACK_BLOSSOM_PUBLIC_ORIGIN:?set NSTACK_BLOSSOM_PUBLIC_ORIGIN}
      NSTACK_BLOSSOM_HEALTH_URL: http://blossom:3000/
      NSTACK_BLOSSOM_VERSION: "6.4.1"
      NSTACK_BLOSSOM_MEDIA_ENABLED: "true"
      NSTACK_BLOSSOM_LIST_ENABLED: "true"
      NSTACK_BLOSSOM_MIRROR_ENABLED: "true"
      NSTACK_BLOSSOM_REPORT_ENABLED: "true"
      # APNs push provider (optional). Unset = provider_not_configured: Tower stays healthy and the inbox/registry keep working.
      # Key custody: APNS_AUTH_KEY_FILE must point under /run/tower-apns-secrets (read-only mount of TOWER_APNS_SECRETS_DIR).
      UNIFIEDPUSH_VAPID_PUBLIC_KEY: ${UNIFIEDPUSH_VAPID_PUBLIC_KEY:-}
      UNIFIEDPUSH_VAPID_PRIVATE_KEY: ${UNIFIEDPUSH_VAPID_PRIVATE_KEY:-}
      UNIFIEDPUSH_VAPID_SUBJECT: ${UNIFIEDPUSH_VAPID_SUBJECT:-}
      UNIFIEDPUSH_ALLOWED_ORIGINS: ${UNIFIEDPUSH_ALLOWED_ORIGINS:-}
      # FCM credentials may be injected by protected runtime settings or a read-only mounted file.
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SENDER_ID: ${FCM_SENDER_ID:-}
      FCM_ANDROID_PACKAGE: ${FCM_ANDROID_PACKAGE:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      FCM_SERVICE_ACCOUNT_JSON_FILE: ${FCM_SERVICE_ACCOUNT_JSON_FILE:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      APNS_CLIENT_APP_ID: ${APNS_CLIENT_APP_ID:-ambulando}
      APNS_EXTRA_TOPICS: ${APNS_EXTRA_TOPICS:-}
      APNS_ENVIRONMENTS: ${APNS_ENVIRONMENTS:-sandbox,production}
      APNS_AUTH_KEY_FILE: ${APNS_AUTH_KEY_FILE:-}
      NOTIF_PUBLIC_ORIGIN: ${NOTIF_PUBLIC_ORIGIN:-}
      NOTIF_ALERTS: ${NOTIF_ALERTS:-on}
      DB_WAIT_MAX_ATTEMPTS: ${DB_WAIT_MAX_ATTEMPTS:-40}
    ports:
      - "${TOWER_HOST_BIND_ADDRESS:-127.0.0.1}:${TOWER_HOST_PORT:-3100}:3100"
    volumes:
      # Directory mount (not a file mount): it is valid and empty when no APNs key exists, so an unconfigured Tower starts normally.
      - ${TOWER_FCM_SECRETS_DIR:-./.runtime/tower-fcm-secrets}:/run/tower-fcm-secrets:ro
      - ${TOWER_APNS_SECRETS_DIR:-./.runtime/tower-apns-secrets}:/run/tower-apns-secrets:ro
    networks:
      default:
      storage-internal:
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3100/health');process.exit(r.ok?0:1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-off storage migration data CLI (scripts/nstack-migrate-storage-host.ts runs it).
  # Deliberately no env_file, no volumes and no Docker socket: DB and storage networks
  # plus the explicit variables below only. Source/target S3 credentials are passed
  # through from the orchestrator's process environment, never on the command line.
  storage-migrate:
    profiles: ["migration"]
    image: ${TOWER_IMAGE:-wingman-tower-tower:latest}
    pull_policy: never
    restart: "no"
    entrypoint: ["bun", "run", "src/scripts/migrate-storage.ts"]
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-coworker_v4}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      SUPERBASED_SERVICE_NSEC: ${SUPERBASED_SERVICE_NSEC:?set SUPERBASED_SERVICE_NSEC}
      STORAGE_S3_SOURCE_PROVIDER:
      STORAGE_S3_SOURCE_ENDPOINT:
      STORAGE_S3_SOURCE_REGION:
      STORAGE_S3_SOURCE_BUCKET:
      STORAGE_S3_SOURCE_ACCESS_KEY:
      STORAGE_S3_SOURCE_SECRET_KEY:
      STORAGE_S3_SOURCE_FORCE_PATH_STYLE:
      STORAGE_S3_TARGET_PROVIDER:
      STORAGE_S3_TARGET_ENDPOINT:
      STORAGE_S3_TARGET_REGION:
      STORAGE_S3_TARGET_BUCKET:
      STORAGE_S3_TARGET_ACCESS_KEY:
      STORAGE_S3_TARGET_SECRET_KEY:
      STORAGE_S3_TARGET_FORCE_PATH_STYLE:
      STORAGE_MIGRATION_SOURCE_IDENTITY:
      STORAGE_MIGRATION_REQUEST_TIMEOUT_MS:
      HOME: /tmp
      BUN_RUNTIME_TRANSPILER_CACHE_PATH: "0"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: ${STORAGE_MIGRATE_MEM_LIMIT:-1g}
    networks:
      default:
      storage-internal:
      migration-source:

networks:
  default:
  storage-internal:
    internal: true
  storage-host:
  # Only the fenced source store and the migration data CLI join this network.
  migration-source:
    internal: true

volumes:
  tower-postgres-data:
  tower-graph-postgres-data:
  tower-minio-data:
  tower-seaweedfs-data:
  tower-nostr-relay-data:
  tower-blossom-data:
