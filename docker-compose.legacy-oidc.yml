# Explicit auth-only transitional overlay. Never needed for fresh NStack.
# Manager reviews API-only activation against existing deployment configuration.
services:
  tower:
    environment:
      NSTACK_LEGACY_FORGEJO_OIDC_ENABLED: "true"
      GIT_OIDC_ALLOWED_NPUBS: ${GIT_OIDC_ALLOWED_NPUBS:-}
      GIT_OIDC_ISSUER: ${GIT_OIDC_ISSUER:-}
      GIT_OIDC_CLIENT_ID: ${GIT_OIDC_CLIENT_ID:-forgejo}
      GIT_OIDC_CLIENT_SECRET: ""
      GIT_OIDC_CLIENT_SECRET_FILE: /run/tower-git-secrets/git-oidc-client-secret
      GIT_OIDC_SIGNING_KEY: ""
      GIT_OIDC_SIGNING_KEY_FILE: /run/tower-git-secrets/git-oidc-signing-key.pem
      GIT_OIDC_REDIRECT_URI: ${GIT_OIDC_REDIRECT_URI:-}
    volumes:
      - type: bind
        source: ${TOWER_GIT_SECRETS_DIR:-./.runtime/tower-git-secrets}/git-oidc-client-secret
        target: /run/tower-git-secrets/git-oidc-client-secret
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TOWER_GIT_SECRETS_DIR:-./.runtime/tower-git-secrets}/git-oidc-signing-key.pem
        target: /run/tower-git-secrets/git-oidc-signing-key.pem
        read_only: true
        bind:
          create_host_path: false
